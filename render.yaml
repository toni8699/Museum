# Confirm the service name, region, and plan before the first Render sync or
# any paid resource is created.
services:
  - type: web
    name: biskiq-api
    runtime: node
    region: ohio
    plan: starter
    buildCommand: npm ci && npm run build:api
    startCommand: npm run start -w @biskiq/api
    healthCheckPath: /health/live
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_KEY
        sync: false
      - key: EDITOR_ORIGIN
        sync: false
      - key: API_ORIGIN
        sync: false
